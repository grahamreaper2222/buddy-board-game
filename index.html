function greet(p){const u=p.g.userData;if(u.gr)return;u.gr=performance.now();u.gy=p.g.rotation.y;const h=new THREE.Group(),m=new THREE.MeshStandardMaterial({color:p.c,metalness:.6,roughness:.35,emissive:p.c,emissiveIntensity:.25}),a=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,.4,8),m),f=new THREE.Mesh(new THREE.SphereGeometry(.11,12,10),m),th=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,.15,8),m);
a.position.set(-.1,-.2,0);a.rotation.z=-.46;th.position.set(0,.14,0);h.add(a,f,th);h.position.set(.5,1.0,.2);p.g.add(h);const s=spr('👍',1.1);s.position.set(0,2.4,0);p.g.add(s);u.hand=h;u.thumb=s;SFX.star()}
function endGreet(p){const u=p.g.userData;u.gr=0;p.g.remove(u.hand,u.thumb)}
function showTurn(p){greet(p);speak(p,'t');const b=$('banner');b.innerHTML=`<div class="av" style="width:36px;height:36px">${catSVG(p.c)}</div><span><b style="color:${p.c}">${p.n}${p.cpu?' 🤖':''}</b>, it’s your turn!</span>`;b.classList.remove('show');void b.offsetWidth;b.classList.add('show')}
function turnStart(){const p=P[cur];if(!p.cpu||busy)return;setTimeout(()=>cpuPlay(p),1400*SL+400)}
async function cpuPlay(p){const token=session;if(!P||P[cur]!==p||busy)return;const op=P.filter(q=>q!==p),ok=op.filter(q=>!q.miss),pr=[.4,.85,1][diff],ld=op.reduce((a,b)=>b.pos>a.pos?b:a),hs=op.filter(q=>q.hand.length),H=k=>!p.usedCard&&p.hand.includes(k)&&Math.random()<pr;
if(H('skip')&&ok.length){await useCard('skip',diff?ok.reduce((a,b)=>b.pos>a.pos?b:a):ok[Math.random()*ok.length|0]);if(token!==session)return;await sleep(600)}
if(H('swap')&&ld.pos>p.pos+10){await useCard('swap',ld);if(token!==session)return;await sleep(900)}
if(H('steal')&&hs.length){await useCard('steal',hs[0]);if(token!==session)return;await sleep(600)}
if(H('dbl')&&!p.dbl&&p.pos<(diff>1?FIN-14:100)){await useCard('dbl');if(token!==session)return;await sleep(500)}
if(H('triple')&&!p.tri&&p.pos<FIN-20){await useCard('triple');if(token!==session)return;await sleep(500)}
if(H('twice')&&!p.bonus){await useCard('twice');if(token!==session)return;await sleep(500)}
if(H('tele')&&B.findIndex((x,i)=>x==='s'&&i>=p.pos+8)>0){await useCard('tele');return}
if(H('fwd')&&p.pos+5<=FIN&&B[p.pos+5]!=='r'){await useCard('fwd');return}
if(token!==session)return;onRoll()}
async function onRoll(){if(busy)return;const token=session;busy=true;upd();const p=P[cur];if(p.g.userData.gr)endGreet(p);const r=await rollDie();if(token!==session)return;let m=r;if(p.tri){m=r*3;p.tri=false;say(`Rolled ${r} ×3 = ${m}`)}else if(p.dbl){m=r*2;p.dbl=false;say(`Rolled ${r} ×2 = ${m}`)}else say(`Rolled ${r}`);await sleep(500);if(token!==session)return;
if(p.burn){douse(p);const o=m;m=Math.max(0,m-2);say(`🔥 Burn! ${o} − 2 = ${m}`);await sleep(1000);if(token!==session)return}
if(m>0&&await advance(p,m)&&await land(p))return;if(token!==session)return;await sleep(500);if(token!==session)return;
if(p.bonus){p.bonus=false;say('🎲 Bonus roll — go again!')}else next();busy=false;upd();turnStart()}
async function useCard(k,tg){if(busy)return;const p=P[cur];if(p.usedCard){say('🚫 Only one Buddy card per turn!');return}
if(k==='fwd'&&p.pos+5>FIN){say('Can’t use Forward 5 — you need an exact finish.');return}
p.hand.splice(p.hand.indexOf(k),1);p.usedCard=true;p.st.used++;
if(k==='swap'||k==='steal'){const os=P.filter(q=>q!==p&&(k==='swap'||q.hand.length)),t=!os.length?null:tg||(os.length===1?os[0]:await chooseTarget(os,k==='swap'?'Swap with who?':'Steal from who?'));if(!t){say('No one to use that on!');p.hand.push(k);p.usedCard=false;p.st.used--;upd();return}
if(k==='swap'){busy=true;const a=p.pos;p.pos=t.pos;t.pos=a;place(p);place(t);SFX.star();say(`🔄 ${p.n} swaps places with ${t.n}!`);upd();await sleep(1300);busy=false;upd()}
else{const c=t.hand.splice(Math.random()*t.hand.length|0,1)[0];p.hand.push(c);speak(t,'b');SFX.star();say(`🧲 ${p.n} stole ${CARDS[c][1]} from ${t.n}!`);upd()}}
else if(k==='tele'){const s=B.findIndex((x,i)=>x==='s'&&i>=p.pos+8);if(s<0){say('No star far enough ahead!');p.hand.push(k);p.usedCard=false;p.st.used--;upd();return}
busy=true;upd();say('🌀 Teleport to a star!');SFX.star();p.pos=s;place(p);await sleep(1300);if(await land(p))return;await sleep(500);next();busy=false;upd();turnStart()}
else if(k==='skip'){const os=P.filter(q=>q!==p),t=tg||(os.length===1?os[0]:await chooseTarget(os));if(!t){p.hand.push(k);p.usedCard=false;p.st.used--;upd();return}t.miss=true;speak(t,'b');say(`⏭️ ${t.n} will miss their next turn!`);upd()}
else if(k==='triple'){p.tri=true;say('3️⃣ Next roll is TRIPLED!');upd()}
else if(k==='dbl'){p.dbl=true;say('⚡ Next roll is doubled!');upd()}
else if(k==='twice'){p.bonus=true;say('🎲 You’ll roll twice this turn!');upd()}
else if(k==='fwd'){busy=true;upd();say('🚀 Forward 5!');await advance(p,5);if(await land(p))return;await sleep(500);next();busy=false;upd();turnStart()}}
function pick(p){return new Promise(res=>{SFX.star();if(p.cpu)setTimeout(()=>{const c=$('ov').querySelectorAll('.card');c[Math.random()*c.length|0].click()},1000),setTimeout(()=>{const g=$('go');g&&g.click()},2800);const U=['dbl','twice','fwd','shd','skip','sword','triple','steal','tele','swap'],W=[...U,'dbl','shd','skip'],deck=shuf([...U]);let done=0;const o=$('ov');o.style.display='flex';
o.innerHTML=`<h1>Buddy Cards</h1><div>Pick one, ${p.n}!</div><div class="cards">${deck.map((k,i)=>`<button class="card" data-i="${i}">?</button>`).join('')}</div><div id="pk"></div>`;
o.querySelectorAll('.card').forEach(b=>b.onclick=()=>{if(done)return;done=1;const k=W[Math.random()*W.length|0],rs=shuf(U.filter(x=>x!==k));deck[b.dataset.i]=k;for(let j=0,q=0;j<deck.length;j++)if(j!=b.dataset.i)deck[j]=rs[q++];p.hand.push(k);
o.querySelectorAll('.card').forEach((c,i)=>{const d=deck[i];c.innerHTML=`${CARDS[d][0]}<small>${CARDS[d][1]}</small>`;c.classList.add(c===b?'rev':'dim')});
$('pk').innerHTML=`<p>You got <b>${CARDS[k][1]}</b>!</p><button class="big" id="go">Continue</button>`;$('go').onclick=()=>{o.style.display='none';upd();res()}})})}
function win(p){SFX.win();speak(p,'w');party(p);try{localStorage.removeItem('bt-save')}catch(e){}busy=true;upd();const o=$('ov');o.style.display='flex';o.innerHTML=`<div style="width:110px">${catSVG(p.c)}</div><h1>🏆 ${p.n} wins!</h1>${statsHTML()}<button class="big" onclick="setup()">Play again</button>`}
function setup(){const o=$('ov');busy=false;fightView=null;o.style.display='flex';o.style.background='';
o.innerHTML=`<h1>Buddy and Twilight’s<br>Battle Race</h1><div>Choose 2–4 cats, and who plays each one</div><div class="grid">${CATS.map((c,i)=>`<div><button class="pick ${sel.includes(i)?'sel':''}" data-i="${i}" style="width:100%">${catSVG(c.c)}<br>${c.n}</button><button class="md" data-m="${i}">${mode[i]?'🤖 Computer':'👤 Human'}</button></div>`).join('')}</div><button class="md" id="df" style="max-width:300px">🤖 Computer level: ${DN[diff]}</button>${hasSave()?'<button class="md" id="ld" style="max-width:300px">▶️ Continue saved game</button>':''}<button class="md" id="hp" style="max-width:300px">❓ How to play</button><div id="er" style="color:#ff8a8a;min-height:20px"></div><button class="big" id="st">Start game</button>`;
o.querySelectorAll('.pick').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;sel=sel.includes(i)?sel.filter(x=>x!==i):[...sel,i].sort();b.classList.toggle('sel')});
o.querySelectorAll('.md').forEach(b=>b.onclick=()=>{const i=+b.dataset.m;mode[i]^=1;b.textContent=mode[i]?'🤖 Computer':'👤 Human'});
$('df').onclick=()=>{diff=(diff+1)%3;$('df').textContent='🤖 Computer level: '+DN[diff]};if($('ld'))$('ld').onclick=load;$('hp').onclick=showHelp;$('st').onclick=()=>{if(sel.length<2){$('er').textContent='Pick at least 2 cats';return}if(sel.every(i=>mode[i])){$('er').textContent='At least one player must be human';return}start()};requestAnimationFrame(()=>{const f=o.querySelector('.pick');if(f)f.focus()})}
function start(){session++;busy=false;fightView=null;over=false;dist=9;yaw=0;pitch=.95;B=gen();PATH=null;P=sel.map(i=>({id:i,n:CATS[i].n,c:CATS[i].c,pos:0,hand:[],dbl:false,tri:false,bonus:false,miss:false,frozen:false,burn:false,cpu:!!mode[i],st:{star:0,used:0,won:0,bad:0}}));cur=0;try{localStorage.removeItem('bt-save')}catch(e){}$('ov').style.display='none';$('ov').style.background='';build();say(`${P[0].n}, roll to begin!`);showTurn(P[0]);upd();$('wrap').scrollTop=1e5;turnStart()}
$('roll').onclick=onRoll;document.addEventListener('keydown',e=>{if(e.code!=='Space'||e.repeat)return;const tag=(e.target&&e.target.tagName||'').toLowerCase();if(['input','textarea','select'].includes(tag))return;if($('ov').style.display!=='none'||$('help').style.display!=='none')return;if(!P||!P[cur]||P[cur].cpu||busy)return;e.preventDefault();onRoll()});

// Xbox / standard gamepad support. Uses the browser Gamepad API and keeps
// keyboard, mouse and touch controls working as before.
let padPrev=[],padNavAt=0,padLast=0;
const visibleControls=()=>Array.from(document.querySelectorAll('button:not(:disabled)')).filter(b=>b.getClientRects().length&&getComputedStyle(b).visibility!=='hidden');
function focusControls(dir){const a=visibleControls();if(!a.length)return;let i=a.indexOf(document.activeElement);if(i<0)i=dir>0?-1:0;i=(i+dir+a.length)%a.length;a[i].focus({preventScroll:true});a[i].scrollIntoView({block:'nearest',inline:'nearest'});}
function gamepadPress(g,i){return !!(g.buttons[i]&&g.buttons[i].pressed)}
function gamepadAction(g){
 const pressed=i=>gamepadPress(g,i)&&!padPrev[i];
 const menuOpen=$('mlist').classList.contains('open');
 const helpOpen=$('help').style.display!=='none';
 const overlayOpen=$('ov').style.display!=='none';
 if(pressed(9)){ if(!overlayOpen&&!helpOpen){$('mlist').classList.toggle('open');if($('mlist').classList.contains('open'))requestAnimationFrame(()=>$('view').focus());else $('mbtn').focus();} }
 if(pressed(1)){
   if(menuOpen){$('mlist').classList.remove('open');$('mbtn').focus()}
   else if(helpOpen){const x=$('hx');if(x)x.click()}
   else if(!overlayOpen&&document.activeElement&&document.activeElement!==document.body){document.activeElement.blur()}
 }
 const x=g.axes&&g.axes.length>0?g.axes[0]:0,y=g.axes&&g.axes.length>1?g.axes[1]:0;
 let dir=0;if(pressed(12)||pressed(14)||y<-.65||x<-.65)dir=-1;else if(pressed(13)||pressed(15)||y>.65||x>.65)dir=1;
 if(dir&&performance.now()-padNavAt>190){focusControls(dir);padNavAt=performance.now()}
 if(pressed(0)){
   const active=document.activeElement;
   if(active&&active.tagName==='BUTTON'&&active.getClientRects().length)active.click();
   else if(menuOpen){$('view').focus();$('view').click()}
   else if(!overlayOpen&&!helpOpen&&P&&P[cur]&&!P[cur].cpu&&!busy)onRoll();
 }
 padPrev=g.buttons.map(b=>!!b.pressed);
}
function gamepadFrame(){try{const pads=navigator.getGamepads?navigator.getGamepads():[];let g=null;for(const p of pads)if(p&&p.connected){g=p;break}if(g)gamepadAction(g);else padPrev=[]}catch(e){}requestAnimationFrame(gamepadFrame)}
window.addEventListener('gamepadconnected',()=>{say('🎮 Controller connected! Use the D-pad, A and B. Menu opens the game menu.');});
window.addEventListener('gamepaddisconnected',()=>{padPrev=[];});
requestAnimationFrame(gamepadFrame);setup();
</script></body></html>
